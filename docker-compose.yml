# DBVS1 = PostgreSQL (M0, M1), DBVS2 = MongoDB (M2), one-shot builders, pgAdmin, mongo-express.
# Credentials come from .env (copy .env.example to .env).
#
#   docker compose up -d                    -> builds everything; pgAdmin http://localhost:5050, mongo-express http://localhost:8081
#   docker compose run --rm migrate-mongo   -> rebuild / reset everything
name: isdb-lab1

services:
  dbvs1:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports: ["5433:5432"]
    volumes: [dbvs1-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 2s
      retries: 30

  dbvs2:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - dbvs2-data:/data/db
      - ./mongo:/work/mongo:ro   # demo: mongosh /work/mongo/demo.js
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\""]
      interval: 2s
      retries: 30

  # M0 + M1 (PostgreSQL)
  setup:
    image: postgres:17
    depends_on:
      dbvs1: { condition: service_healthy }
    environment:
      PGUSER: ${PG_USER}
      PGPASSWORD: ${PG_PASSWORD}
    volumes:
      - ./sql:/work/sql:ro
      - ./scripts:/work/scripts:ro
    entrypoint: ["bash", "/work/scripts/build.sh"]
    restart: "no"

  # M2 (MongoDB): M0 columns -> documents, split by the M1 fragments' id sets
  migrate-mongo:
    image: node:22
    depends_on:
      setup: { condition: service_completed_successfully }
      dbvs2: { condition: service_healthy }
    environment:
      PG_HOST: dbvs1
      PG_PORT: "5432"
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DATABASE: isdb_original
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@dbvs2:27017/?authSource=admin
    volumes:
      - ./mongo:/src:ro
    command: ["bash", "-c", "mkdir -p /app && cp /src/migrate.js /src/package.json /app/ && cd /app && npm install --no-audit --no-fund --silent && node migrate.js"]
    restart: "no"

  pgadmin:
    image: dpage/pgadmin4:latest
    depends_on: [dbvs1]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["5050:80"]
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./sql:/home/sql:ro   # Query Tool -> Open File -> /home/sql

  mongo-express:
    image: mongo-express:latest
    depends_on:
      dbvs2: { condition: service_healthy }
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@dbvs2:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"   # local lab only, no login prompt
    ports: ["8081:8081"]

volumes:
  dbvs1-data:
  dbvs2-data:
